version: '3.8'

volumes:
  vol_prometheus: {}
  vol_grafana: {}
  vol_grovepi_var: {}

services:
  bootstrap:
    image: alpine:3.17.3
    container_name: bootstrap
    command: 
      - /bin/sh
      - -c 
      - |
        /bin/echo "Starting bootstrap (one time job at start)"
        /bin/rm -f /code/var/grovepi.lock
        /bin/echo "Done"
    volumes:
      - vol_grovepi_var:/code/var
    restart: "no"

  grovepi_exporter:
    env_file: 
      - envs/global
      - envs/grovepi
      - envs/alerts_threshold
    container_name: grovepi_exporter
    privileged: true
    stdin_open: true
    tty: true
    ports:
      - "8081:8081"
    command: "python /code/collector.py"
    build:
      context: ./dockers/grovepi_exporter/
      dockerfile: ./Dockerfile
    image: grovepi_exporter:latest
    volumes:
        - /dev/i2c-1:/dev/i2c-1
        - ./dockers/grovepi_exporter/code:/code
        - vol_grovepi_var:/code/var
    devices:
        - /dev/i2c-1:/dev/i2c-1
    depends_on:
      - 'bootstrap'
    restart: always

  grovepi_input:
    env_file: 
      - envs/global
      - envs/grovepi
      - envs/alerts_threshold
    container_name: grovepi_input
    privileged: true
    stdin_open: true
    tty: true
    command: "python /code/app.py"
    image: grovepi_exporter:latest
    volumes:
        - /dev/i2c-1:/dev/i2c-1
        - ./dockers/grovepi_input/code:/code
        - vol_grovepi_var:/code/var
    devices:
        - /dev/i2c-1:/dev/i2c-1
    depends_on:
      - grovepi_exporter
    restart: always
  

  grovepi_receiver:
    image: grovepi_receiver:latest
    build:
      context: ./dockers/grovepi_receiver/
      dockerfile: ./Dockerfile
    env_file: 
      - envs/global
      - envs/grovepi
    container_name: grovepi_receiver 
    privileged: true
    stdin_open: true
    tty: true
    ports:
      - "8082:8082"
    command: "python /code/app.py"
    volumes:
        - /dev/i2c-1:/dev/i2c-1
        - ./dockers/grovepi_receiver/code:/code
        - vol_grovepi_var:/code/var
    devices:
        - /dev/i2c-1:/dev/i2c-1
    depends_on:
      - grovepi_input
    restart: always

  prometheus:
    image: prom/prometheus:v2.40.7
    container_name: prometheus
    user: root
    env_file: 
      - envs/global
    volumes:
      - ./dockers/prometheus:/etc/prometheus/
      - vol_prometheus:/data
    ports:
      - "9090:9090"
    command:
      - '--storage.tsdb.path=/data'
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--log.level=error'
      - '--enable-feature=expand-external-labels'
    restart: always
    depends_on:
      - grovepi_receiver
  
  alertmanager:
    image: prom/alertmanager:v0.24.0
    container_name: alertmanager
    env_file: 
      - envs/global
    ports: 
      - "9093:9093"
    volumes:
      - ./dockers/alertmanager:/etc/alertmanager/
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--log.level=error'
    depends_on:
      - prometheus
    restart: always

  node_exporter:
    image: quay.io/prometheus/node-exporter:v1.5.0
    container_name: node_exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
      - '--log.level=error'
    restart: unless-stopped
    ports: 
      - "9100:9100"
    restart: always
    depends_on:
      - alertmanager

  grafana:
    image: grafana/grafana:9.4.7
    container_name: grafana
    env_file: 
      - envs/global
    environment:
      - "GF_LOG_LEVEL=error"
    volumes:
      - vol_grafana:/var/lib/grafana
      - ./dockers/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./dockers/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    depends_on:
      - node_exporter
    restart: always

